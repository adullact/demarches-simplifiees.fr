    RAILS_ENV: production
    RAILS_LOG_TO_STDOUT: 1
    RAILS_MAX_THREADS: 4
    RAILS_QUEUE_ADAPTER: delayed_job
    REDIS_NAMESPACE: demarches-simplifiees-somme-numerique
    SECRET_KEY_BASE: 6997JJgfdsdxZyFHNFbEPEoGfNJaYHdp7mT62sdtqcD9WePcr42cYRE4Bcuqaz9oYcHzmGzZAS
    SENTRY_CURRENT_ENV: somme-numerique-production
    SENTRY_DSN_JS: "https://039f9936f6a5ea3e2d26b5d782b08652@sentry.critical.tech.ouidou.fr/15"
    SENTRY_DSN_RAILS: "https://039f9936f6a5ea3e2d26b5d782b08652@sentry.critical.tech.ouidou.fr/15"
    SENTRY_ENABLED: "enabled"
    SMTP_AUTHENTICATION: "plain"
    SMTP_TLS: 1
    SOURCE: "tps_dev"
    STATUS_PAGE_URL: ""
    TECH_EMAIL: "support@demarches-hdf.fr"
    TRUSTED_NETWORKS: ""
    WEB_CONCURRENCY: 5
  extraSecretEnv:
    - fromSecret:
        name: stack-postgresql
        data:
          DB_HOST: postgresql-host
          DB_PASSWORD: postgresql-password
          DB_USERNAME: postgresql-username
    - fromSecret:
        name: stack-redis
        data:
          REDIS_URL: redis-full-host
    - fromSecret:
        name: aws-s3
        data:
          S3_ACCESS_KEY_ID: aws_access_key_id
          S3_SECRET_ACCESS_KEY: aws_secret_access_key
    - fromSecret:
        name: common
        data:
          OTP_SECRET_KEY: otp_secret_key
          PIPEDRIVE_KEY: pipedrive_key
          SIGNING_KEY: signing_key
          SKYLIGHT_AUTHENTICATION_KEY: skylight_authentication_key
          ENCRYPTION_SERVICE_SALT: encryption_service_salt
          API_ENTREPRISE_KEY: api_entreprise_key
          INVISIBLE_CAPTCHA_SECRET: invisible_captcha_secret
          AR_ENCRYPTION_PRIMARY_KEY: ar_encryption_primary_key
          AR_ENCRYPTION_KEY_DERIVATION_SALT: ar_encryption__key_derivation_salt
    - fromSecret:
        name: saml
        data:
          SAML_IDP_CERTIFICATE: idp_certificate
          SAML_IDP_ENABLED: enabled
          SAML_IDP_SECRET_KEY: idp_secret_key
    - fromSecret:
        name: smtp
        data:
          SMTP_DEFAULT_RECIPIENT: default_recipient
          SMTP_HOST: host
          SMTP_PASS: password
          SMTP_PORT: port
          SMTP_SENDER: sender
          SMTP_USER: username
    - fromSecret:
        name: universign
        data:
          UNIVERSIGN_API_URL: api_url
          UNIVERSIGN_USERPWD: user_password
    - fromSecret:
        name: certigna
        data:
          CERTIGNA_API_URL: api_url
          CERTIGNA_USERPWD: user_password
    - fromSecret:
        name: mailtrap
        data:
          MAILTRAP_PASSWORD: password
          MAILTRAP_USERNAME: username
          MAILTRAP_ENABLED: enabled
    - fromSecret:
        name: mailjet
        data:
          MAILJET_API_KEY: api_key
          MAILJET_SECRET_KEY: secret_key
    - fromSecret:
        name: helpscout
        data:
          HELPSCOUT_CLIENT_ID: client_id
          HELPSCOUT_CLIENT_SECRET: client_secret
          HELPSCOUT_MAILBOX_ID: mailbox_id
          HELPSCOUT_WEBHOOK_SECRET: webhook_secret
    - fromSecret:
        name: fog-openstack
        data:
          FOG_OPENSTACK_API_KEY: api_key
          FOG_OPENSTACK_AUTH_URL: auth_url
          FOG_OPENSTACK_REGION: region
          FOG_OPENSTACK_URL: url
          FOG_OPENSTACK_USERNAME: username
    - fromSecret:
        name: fc-particulier
        data:
          FC_PARTICULIER_ID: id
          FC_PARTICULIER_SECRET: secret
    - fromSecret:
        name: api-particulier
        data:
          API_PARTICULIER_URL: base_url
    - fromSecret:
        name: crisp
        data:
          CRISP_CLIENT_KEY: client_key
          CRISP_ENABLED: enabled
    - fromSecret:
        name: basic-auth-ds
        data:
          BASIC_AUTH_ENABLED: enabled
          BASIC_AUTH_PASSWORD: password
          BASIC_AUTH_USERNAME: username
    - fromSecret:
        name: sendinblue
        data:
          SENDINBLUE_API_V3_KEY: api_v3_key
          SENDINBLUE_BALANCING_VALUE: balancing_value
          SENDINBLUE_BALANCING: balancing
          SENDINBLUE_CLIENT_KEY: client_key
          SENDINBLUE_ENABLED: enabled
          SENDINBLUE_SMTP_KEY: smtp_key
          SENDINBLUE_USER_NAME: user_name
  releaseTasks:
    - name: db-schema-load
      command: ["/bin/bash"]
      weight: "-6"
      steps: "pre-install"
      args:
        - "-c"
        - "rake db:schema:load"
      extraEnv: []
    - name: db-migrate
      command: ["/bin/bash"]
      weight: "-5"
      steps: "pre-upgrade"
      args:
        - "-c"
        - "rake db:migrate"
      extraEnv: []
    - name: after-party
      command: ["/bin/bash"]
      weight: "-4"
      steps: "pre-upgrade"
      args:
        - "-c"
        - "rake after_party:run"
      extraEnv: []
    - name: jobs-schedule
      command: ["/bin/bash"]
      weight: "-3"
      steps: "pre-install,pre-upgrade"
      args:
        - "-c"
        - "rake jobs:schedule"
      extraEnv: []
    - name: bootstrap-admin
      command: ["/bin/bash"]
      weight: "-4"
      steps: "pre-install"
      args:
        - "-c"
        - "rake bootstrap:all"
      extraEnv: []
delayed_job:
  command: rake jobs:work
assets:
  image: build.ouidou.fr/nord/adullact/demarches-simplifiees.fr/assets:__ASSETS_VERSION__
  extraEnv:
    DEPLOY_TIMESTAMP: 1234
custom_assets:
  enabled: "true"
  image: build.ouidou.fr/nord/adullact/custom-assets/app:__CUSTOM_ASSETS_VERSION__
  extraEnv:
    DEPLOY_TIMESTAMP: 1234
ingress:
  tls:
    secretName: sm-ds-production-cloud-crt
  annotations:
    ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      rewrite ^/contact/?$ https://www.lafibrenumerique5962.fr/demarches-simplifiees-support/ permanent;
      rewrite ^/contact-admin/?$ https://www.lafibrenumerique5962.fr/demarches-simplifiees-support-administrateur/ permanent;
      rewrite ^/administration/?$ https://www.lafibrenumerique5962.fr/demarches-simplifiees-service-en-ligne/ permanent;
