    CLAMAV_ENABLED: disabled
    CLASSIC_SMTP_ENABLED: enabled
    CONTACT_ADDRESS: "Quartier des trois parallèles\n 335 All du Général Girard\n 62000 ARRAS"
    CONTACT_EMAIL: "contact@demarches-hdf.fr"
    CONTACT_PHONE: "03 74 04 59 53"
