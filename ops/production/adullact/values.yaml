app:
  domainName: __URL_PRODUCTION__
  image: __CI_REGISTRY_IMAGE__/app:__APP_VERSION__
  replicaCount: 3
  initContainers: false
  ports:
    - name: default
      external: 80
      internal: 3000
  volumes:
    emptyDir:
      - name: custom-config
        emptyDir: {}
    secret:
      - name: redis-tls-volume
        secret: stack-redis-certificates
  mounts:
    - name: custom-config
      mountPath: /app/app/custom_views/
      subPath: custom_views
    - name: custom-config
      mountPath: /app/config/custom_locales/
      subPath: custom_locales
  extraEnv:
    ACTIVE_STORAGE_SERVICE: scaleway
    ADMINS_GROUP_ENABLED: "enabled"
    AGENT_CONNECT_BASE_URL: ""
    AGENT_CONNECT_ENABLED: "disabled"
    AGENT_CONNECT_ID: ""
    AGENT_CONNECT_JWKS: ""
    AGENT_CONNECT_REDIRECT: ""
    AGENT_CONNECT_SECRET: ""
    API_ADRESSE_URL: "https://api-adresse.data.gouv.fr"
    API_EDUCATION_URL: "https://data.education.gouv.fr/api/records/1.0"
    API_ENTREPRISE_DEFAULT_SIRET: "44378317000030"
    API_GEO_URL: "https://geo.api.gouv.fr"
    APP_HOST: __URL_PRODUCTION__
    APP_NAME: "tps"
    APPLICATION_BASE_URL: https://__URL_PRODUCTION__
    APPLICATION_NAME: __URL_PRODUCTION__
    APPLICATION_SHORTNAME: ds.adullact.org
    BOOTSTRAP_ADMIN_ENABLED: 0
    CERTIGNA_ENABLED: "disabled"
    CGU_URL: "https://faq.adullact.org/logiciels/117-cgu-demarches-simplifiees-adullact"
    CLAMAV_ENABLED: disabled
    CONTACT_ADDRESS: "Association Adullact\n5 rue du Plan du Palais\n 34000 Montpellier"
    CONTACT_EMAIL: "ne-pas-repondre@adullact.org"
    CONTACT_PHONE: "04 67 65 05 88"
    DB_DATABASE: adullact-ds-production
    DB_POOL: 5
    DEMANDE_INSCRIPTION_ADMIN_PAGE_URL: "https://adullact.org/service-en-ligne-demarches-simplifiees"
    DS_PROXY_URL: ""
    EQUIPE_EMAIL: "demarches-simplifiees@adullact.org"
    FC_PARTICULIER_BASE_URL: "https://app.franceconnect.gouv.fr"
    HEADER_LOGO_ALT: ""
    HEADER_LOGO_HEIGHT: "56"
    HEADER_LOGO_WIDTH: "65"
    HOST_URL: __URL_PRODUCTION__
    IGN_CARTE_REFERER: __URL_PRODUCTION__
    LANDING_TESTIMONIALS_ENABLED: "disabled"
    LANDING_USERS_ENABLED: "disabled"
    LOGRAGE_ENABLED: "disabled"
    LOGRAGE_SOURCE: "tps_prod"
    MAILCATCHER_ENABLED: "disabled"
    MAILCATCHER_HOST: ""
    MAILCATCHER_PORT: ""
    MATOMO_COOKIE_DOMAIN: "*.__URL_PRODUCTION__"
    MATOMO_DOMAIN: "*.__URL_PRODUCTION__"
    MATOMO_ENABLED: "enabled"
    MATOMO_HOST: "statistiques.adullact.org"
    MATOMO_ID: "15"
    MATOMO_IFRAME_URL: "https://statistiques.adullact.org/index.php?module=CoreAdminHome&action=optOut&language=fr&&fontColor=333333&fontSize=16px&fontFamily=Muli"
    MENTIONS_LEGALES_URL: "https://faq.adullact.org/logiciels/119-mentions-legales-demarches-simplifiees-adullact"
    MIGRATE_PJS: "disabled" # TO BE REMOVED WHEN MIGRATION IS REMOVED pull/9857
    NEW_MAX_DUREE_CONSERVATION: 18
    NO_REPLY_EMAIL: "ne-pas-repondre@adullact.org"
    OLD_CONTACT_EMAIL: "demarches-simplifiees@adullact.org"
    RAILS_ENV: production
    RAILS_LOG_TO_STDOUT: 1
    RAILS_MAX_THREADS: 4
    RAILS_QUEUE_ADAPTER: delayed_job
    REDIS_NAMESPACE: adullact-ds
    REDIS_SSL_CA_FILE: "/app/config/tls/scw.pem"
    S3_BUCKET: fr.ouidou.production.adullact
    S3_ENDPOINT: https://s3.fr-par.scw.cloud
    S3_REGION: fr-par
    SECRET_KEY_BASE: e76759d7d78040213871e0a83a9d6701890f13b8c9335dee7edd0c801ac43c3eba2bb157777de9cdcf4f0cb377633f9bb254c28e08fe3a6e4dd283366c84d7ea
    SENTRY_CURRENT_ENV: adullact-ds
    SENTRY_DSN_JS: "https://34e18f8ed331122e03b4b3b4cb8cf437@sentry.critical.tech.ouidou.fr/13"
    SENTRY_DSN_RAILS: "https://34e18f8ed331122e03b4b3b4cb8cf437@sentry.critical.tech.ouidou.fr/13"
    SENTRY_ENABLED: "enabled"
    SOURCE: "tps"
    STATUS_PAGE_URL: "https://stats.uptimerobot.com/L5O2LiPXR4"
    STRICT_EMAIL_VALIDATION_STARTS_ON: "2024-04-19"
    TECH_EMAIL: "demarches-simplifiees@adullact.org"
    TRUSTED_NETWORKS: ""
    WEASYPRINT_URL: "http://127.0.0.1:5000/pdf"
    WEB_CONCURRENCY: 5
  extraSecretEnv:
    - fromSecret:
        name: stack-postgresql
        data:
          DB_HOST: postgresql-host
          DB_PASSWORD: postgresql-password
          DB_PORT: postgresql-port
          DB_USERNAME: postgresql-username
    - fromSecret:
        name: stack-redis
        data:
          REDIS_URL: redis-full-host
          REDIS_USERNAME: user
          REDIS_PASSWORD: password
          REDIS_HOST: host
          REDIS_PORT: port
    - fromSecret:
        name: scaleway
        data:
          S3_ACCESS_KEY_ID: scw_access_key_id
          S3_SECRET_ACCESS_KEY: scw_secret_access_key
    - fromSecret:
        name: common
        data:
          API_ENTREPRISE_KEY: api_entreprise_key
          AR_ENCRYPTION_KEY_DERIVATION_SALT: ar_encryption__key_derivation_salt
          AR_ENCRYPTION_PRIMARY_KEY: ar_encryption_primary_key
          ENCRYPTION_SERVICE_SALT: encryption_service_salt
          INVISIBLE_CAPTCHA_SECRET: invisible_captcha_secret
          OTP_SECRET_KEY: otp_secret_key
          PIPEDRIVE_KEY: pipedrive_key
          SIGNING_KEY: signing_key
          SKYLIGHT_AUTHENTICATION_KEY: skylight_authentication_key
    - fromSecret:
        name: saml
        data:
          SAML_IDP_CERTIFICATE: idp_certificate
          SAML_IDP_ENABLED: enabled
          SAML_IDP_SECRET_KEY: idp_secret_key
    - fromSecret:
        name: universign
        data:
          UNIVERSIGN_API_URL: api_url
          UNIVERSIGN_USERPWD: user_password
    - fromSecret:
        name: certigna
        data:
          CERTIGNA_API_URL: api_url
          CERTIGNA_USERPWD: user_password
    - fromSecret:
        name: mailtrap
        data:
          MAILTRAP_PASSWORD: password
          MAILTRAP_USERNAME: username
          MAILTRAP_ENABLED: enabled
    - fromSecret:
        name: mailjet
        data:
          MAILJET_API_KEY: api_key
          MAILJET_SECRET_KEY: secret_key
    - fromSecret:
        name: helpscout
        data:
          HELPSCOUT_CLIENT_ID: client_id
          HELPSCOUT_CLIENT_SECRET: client_secret
          HELPSCOUT_MAILBOX_ID: mailbox_id
          HELPSCOUT_WEBHOOK_SECRET: webhook_secret
    - fromSecret:
        name: fog-openstack
        data:
          FOG_OPENSTACK_API_KEY: api_key
          FOG_OPENSTACK_AUTH_URL: auth_url
          FOG_OPENSTACK_REGION: region
          FOG_OPENSTACK_URL: url
          FOG_OPENSTACK_USERNAME: username
    - fromSecret:
        name: fc-particulier
        data:
          FC_PARTICULIER_ID: id
          FC_PARTICULIER_SECRET: secret
    - fromSecret:
        name: api-particulier
        data:
          API_PARTICULIER_URL: base_url
    - fromSecret:
        name: crisp
        data:
          CRISP_CLIENT_KEY: client_key
          CRISP_ENABLED: enabled
    - fromSecret:
        name: basic-auth-ds
        data:
          BASIC_AUTH_ENABLED: enabled
          BASIC_AUTH_PASSWORD: password
          BASIC_AUTH_USERNAME: username
    - fromSecret:
        name: sendinblue
        data:
          SENDINBLUE_API_V3_KEY: api_v3_key
          SENDINBLUE_BALANCING_VALUE: balancing_value
          SENDINBLUE_CLIENT_KEY: client_key
          SENDINBLUE_SMTP_KEY: smtp_key
          SENDINBLUE_USER_NAME: user_name
    - fromSecret:
        name: github
        data:
          GITHUB_CLIENT_ID: github_client_id
          GITHUB_CLIENT_SECRET: github_client_secret
  releaseTasks:
    - name: db-migrate
      command: ["/bin/bash"]
      weight: "-5"
      steps: "pre-install,pre-upgrade"
      args:
        - "-c"
        - "rake db:migrate"
      extraEnv: []
    - name: after-party
      command: ["/bin/bash"]
      weight: "-4"
      steps: "pre-install,pre-upgrade"
      args:
        - "-c"
        - "rake after_party:run"
      extraEnv: []
    - name: jobs-schedule
      command: ["/bin/bash"]
      weight: "-3"
      steps: "pre-install,pre-upgrade"
      args:
        - "-c"
        - "rake jobs:schedule"
      extraEnv: []
  backup:
    include_app_env: true
    extraEnv:
      ENCRYPT_BACKUP: "true"
      POSTGRES_DB: adullact-ds-production
      S3_PREFIX: "adullact/ds/production"
      SGBD_TYPE: "postgres"
    extraSecretEnv:
      - fromSecret:
          name: aws-s3-backup
          data:
            AWS_ACCESS_KEY_ID: aws_access_key_id
            AWS_SECRET_ACCESS_KEY: aws_secret_access_key
      - fromSecret:
          name: ansible-vault-s3
          data:
            ENCRYPT_BACKUP_KEY: backup-key
      - fromSecret:
          name: stack-postgresql
          data:
            PGPASSWORD: postgresql-password
            POSTGRES_HOST: postgresql-host
            POSTGRES_USER: postgresql-username

  sides:
    sidekiq:
      include_app_env: true
      with_service: false
      with_app_volume: false
      image: __CI_REGISTRY_IMAGE__/app:__APP_VERSION__
      internalPort: 80
      command: ["/bin/bash"]
      args:
        - "-c"
        - "bundle exec sidekiq -C config/sidekiq.yml"

    delayed-job:
      with_service: false
      with_app_env: true
      with_app_volume: true
      image: __CI_REGISTRY_IMAGE__/app:__APP_VERSION__
      command: ["/bin/bash"]
      args:
        - "-c"
        - "rake jobs:work"
      initContainers:
        - name: custom-config
          image: build.ouidou.fr/nord/adullact/custom-assets/app:__CUSTOM_ASSETS_VERSION__
          mounts:
            - name: custom-config
              mountPath: /data
          command: ["/bin/sh"]
          args:
            - "-c"
            - >
              cp -r /app/app/custom_views/ /data/ &&
              cp -r /app/config/custom_locales/ /data/

    assets:
      with_service: true
      with_app_env: true
      with_app_volume: false
      image: __CI_REGISTRY_IMAGE__/assets:__ASSETS_VERSION__
      livenessProbe:
        httpGet:
          path: /health
          port: 80
        initialDelaySeconds: 10
        timeoutSeconds: 2
      readinessProbe:
        httpGet:
          path: /health
          port: 80
        initialDelaySeconds: 20
        timeoutSeconds: 2

    custom_assets:
      with_service: true
      with_app_env: true
      with_app_volume: false
      image: build.ouidou.fr/nord/adullact/custom-assets/app:__CUSTOM_ASSETS_VERSION__
      extraEnv:
        DOSSIER_PDF_EXPORT_LOGO_SRC: "images/logo-pdf-export-adullact_360x28.png"
        FAVICON_16PX_SRC: "images/16x16.png"
        FAVICON_32PX_SRC: "images/32x32.png"
        FAVICON_96PX_SRC: "images/96x96.png"
        FAVICON_APPLE_TOUCH_152PX_SRC: "images/apple-touch-icon_adullact.png"
        FOOTER_LOGO_SRC: "images/logo-footer-adullact_200x71.png"
        HEADER_LOGO_SRC: "images/logo-header-adullact_65x56.png"
        MAILER_FOOTER_LOGO_SRC: "images/logo-mail-footer-adullact_200x71.png"
        MAILER_LOGO_SRC: "images/logo-mail-header-adullact_600x63.png"
        PROCEDURE_DEFAULT_LOGO_SRC: "images/procedure-default-logo-adullact.svg"
      livenessProbe:
        httpGet:
          path: /health
          port: 80
        initialDelaySeconds: 10
        timeoutSeconds: 2
      readinessProbe:
        httpGet:
          path: /health
          port: 80
        initialDelaySeconds: 20
        timeoutSeconds: 2

ingress:
  tls:
    secretName: adullact-ds-crt
  sides:
    assets:
      paths:
        - assets
        - vite
        - packs
        - favicon.ico
        - csv
        - robot.txt
        - logo-ds.svg
      pathType: ImplementationSpecific
    custom-assets:
      paths:
        - custom-assets
      pathType: ImplementationSpecific
  annotations:
    ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/use-regex: "true"
    # nginx.ingress.kubernetes.io/configuration-snippet annotation cannot be used. Snippet directives are disabled by the Ingress administrator
    nginx.ingress.kubernetes.io/configuration-snippet: |
      rewrite ^/contact/?$ https://faq.adullact.org/services-adullact/demarches-simplifiees/support/ permanent;
      rewrite ^/contact-admin/?$ https://faq.adullact.org/services-adullact/demarches-simplifiees/support/ permanent;
      rewrite ^/administration/?$ https://adullact.org/service-en-ligne-demarches-simplifiees permanent;
