apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB_NAME__
  labels:
    type: delete-database
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: build.synbioz.com/synbioz/docker-images/postgresql-aws-s3/app:0.6.0-postgres-13.2
          command: [ "/scripts/delete" ]
          env:
          - name: POSTGRES_DB
            value: "demarches-simplifiees-__ENV_NAME__"
          - name: POSTGRES_HOST
            valueFrom:
              secretKeyRef:
                name: stack-postgresql-13
                key: postgresql-host
          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: stack-postgresql
                key: postgresql-username
          - name: PGPASSWORD
            valueFrom:
              secretKeyRef:
                name: stack-postgresql
                key: postgresql-password
      imagePullSecrets:
        - name: synbioz
