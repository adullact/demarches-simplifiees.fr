<!DOCTYPE html>
<html lang='fr'>
<head>
  <meta content='text/html; charset=UTF-8' http-equiv='Content-Type'>
  <meta content='IE=edge' http-equiv='X-UA-Compatible'>
  <meta content='no-cache' name='turbolinks-cache-control'>
  <meta content='width=device-width, initial-scale=1' name='viewport'>
  <title>
    Erreur 500 · demarches.adullact.org
  </title>
  <style>
    html,body,div,span,h1,p,a,img,table,tbody,tfoot,thead,tr,th,td{margin:0;padding:0;border:0;font-size:100%;font:inherit;vertical-align:baseline;}
    html,body{height:100%;}
    body{line-height:1;font-family:"Muli", system-ui, -apple-system, sans-serif;color:#333333;font-size:16px;line-height:1.42857143;}
    html{box-sizing:border-box;}
    *,*::before,*::after{box-sizing:inherit;}
    a{text-decoration:none;}
    .page-wrapper{position:relative;min-height:100%;}
    .container{padding-left:16px;padding-right:16px;max-width:700px;margin:0 auto;}
    .flex{display:flex;}
    .flex.align-center{align-items:center;}
    .header-inner-content{padding-left:16px;padding-right:16px;max-width:1072px;margin:0 auto;display:flex;justify-content:space-between;min-height:72px;}
    .new-header{background-color:#FFFFFF;}
    .new-header-with-border{border-bottom:1px solid #CCCCCC;}
    .header-logo{
      display:inline-block;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      margin-right:32px;
      color: #000091;
      font-size: 24px;
      font-weight: bold;
    }
    .header-logo img{
      height:100%;
      margin-right:0.5em;
    }
    .new-h1{color:#333333;text-align:center;font-weight:bold;margin-bottom:60px;font-size:41px;margin-top:60px;}
    .description{font-size: 18px; margin-bottom: 8px;}
    /*! CSS Used fontfaces */
    @font-face{font-family:"Muli";src:url(/fonts/muli/Muli-Regular.woff) format("woff");font-weight:normal;font-style:normal;}
  </style>
</head>
<body>
  <div class='page-wrapper'>
    <div class='new-header new-header-with-border'>
      <div class='header-inner-content'>
        <div class='flex align-center'>
          <a class="header-logo" title="Aller à la page d’accueil" href="/">
            <img alt="" src="/custom-assets/images/logo-header-adullact_65x56.png">
            demarches.adullact.org
          </a>
        </div>
      </div>
    </div>
    <div class='container'>
      <h1 class='new-h1'>Une erreur est survenue</h1>
      <p class='description'>
        Nos équipes ont été averties.
      </p>
      <p class='description'>
        Si le problème persiste ou si vous voulez nous donner des détails
        concernant l'erreur qui vient de se produire, vous pouvez
        <a href="https://faq.adullact.org/services-adullact/demarches-simplifiees/support/"
           target="_blank" rel="noopener">nous contacter</a>.
      </p>
    </div>
  </div>
</body>
</html>
