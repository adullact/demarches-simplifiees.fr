include:
  - project: ouidou/ci-templates
    ref: 0.3.3
    file: rails/.gitlab-ci-template.yml

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_UPDATE_FLAGS: --remote
  GIT_SUBMODULE_FORCE_HTTPS: "true"
  NODE_ENV: production
  WITH_ASSETS: "1"
  WITH_BRAKEMAN: "1"
  WITH_BUNDLE_AUDIT: "1"
  WITH_RAILS_BEST_PRACTICES: "1"
  WITH_REEK: "1"
  WITH_RUBOCOP: "1"

default:
  interruptible: true

prepare:
  variables:
    PACKAGE: ops/ci/base/packages.txt
    RAILS_VERSION: ruby3.2.2-rails7.0.5

.review:
  variables:
    CUSTOM_ASSETS_IMAGE: build.ouidou.fr/nord/adullact/custom-assets/app:adullact-0.8.2.rc19
    ENV_NAME: review
    HELM_CHART_NAME: demarches-simplifiees
    HELM_CHART_VERSION: 0.2.0
    HELM_REPO_NAME: adullact
    HELM_REPO_URL: ${CI_API_V4_URL}/projects/349/packages/helm/stable
    K8S_NAMESPACE: adullact-ds-staging
    PREFIX_APP_NAME: adullact-ds
    REVIEW_DOMAIN: adullact-ds.review.ouidou.fr
    SKIP_RESTORE_STAGE: "true"

staging:adullact:
  image: build.ouidou.fr/docker-images/auto-deploy-image/app:0.2.1
  stage: deploy
  environment:
    name: staging
    url: https://adullact-ds.staging.ouidou.fr
  variables:
    CUSTOM_ASSETS_IMAGE: build.ouidou.fr/nord/adullact/custom-assets/app:adullact-0.8.2.rc19
    ENV_NAME: staging
    HELM_CHART_NAME: demarches-simplifiees
    HELM_CHART_VERSION: 0.2.0
    HELM_REPO_NAME: adullact
    HELM_REPO_URL: ${CI_API_V4_URL}/projects/349/packages/helm/stable
    K8S_NAMESPACE: adullact-ds-staging
    PATH_VALUE: adullact/
    PREFIX_APP_NAME: adullact-ds
    SKIP_RESTORE_STAGE: "true"
    URL_STAGING: adullact-ds.staging.ouidou.fr
  script:
    - /apps/scripts/auto_deploy.sh staging
  when: manual

staging:sn:
  image: build.ouidou.fr/docker-images/auto-deploy-image/app:0.2.1
  stage: deploy
  environment:
    name: somme-numerique-staging
    url: https://preprod.demarches-hdf.fr
  variables:
    APP_VERSION: 1.5.5
    ASSETS_VERSION: 1.5.5
    CUSTOM_ASSETS_VERSION: somme-numerique-0.8.2.rc21
    ENV_NAME: staging
    HELM_CHART_NAME: demarches-simplifiees
    HELM_CHART_VERSION: 0.2.0
    HELM_REPO_NAME: adullact
    HELM_REPO_URL: ${CI_API_V4_URL}/projects/349/packages/helm/stable
    K8S_NAMESPACE: sm-staging
    PATH_VALUE: somme-numerique/
    RELEASE_NAME: sm-staging-demarches-simplifiees
    SKIP_RESTORE_STAGE: "true"
  script:
    - /apps/scripts/auto_deploy.sh staging
  when: manual

